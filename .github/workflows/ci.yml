---
# Checks every push and pull request: lint, types, formatting and the docs,
# every package's tests, and the shared lint workflows.
name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566

      - name: Check
        run: mise run check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566

      - name: Test
        run: mise run test

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0

---
# Checks every push and pull request: lint, types, formatting and the docs,
# every package's tests, and the shared lint workflows.
name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Check
        run: mise run check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Test
        run: mise run test

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@13dce11f125107b83ea662167f1091d070dcd359 # 20261114.0

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@13dce11f125107b83ea662167f1091d070dcd359 # 20261114.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@13dce11f125107b83ea662167f1091d070dcd359 # 20261114.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@13dce11f125107b83ea662167f1091d070dcd359 # 20261114.0

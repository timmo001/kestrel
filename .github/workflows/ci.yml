---
# Checks every push and pull request: lint, types, formatting and the docs,
# every package's tests, and the shared lint workflows.
name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    uses: timmo001/workflows/.github/workflows/run-mise-task.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
    with:
      name: Check
      task: check

  test:
    uses: timmo001/workflows/.github/workflows/run-mise-task.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
    with:
      name: Test
      task: test

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1

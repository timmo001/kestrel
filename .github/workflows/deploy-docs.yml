---
# Deploys the prod stage of the docs site's Alchemy stack in docs/alchemy.run.ts
# from main: the kestrel-docs Worker at kestrel.timmo.dev. The Cloudflare token
# comes from docs/stacks/github.ts. The docs install from the root workspace
# and take their theme from the web app.
name: Deploy docs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-docs.yml
      - bun.lock
      - docs/**
      - mise.toml
      - package.json
      - packages/web/src/kestrel.theme.json
  workflow_dispatch: {}

# Deploys queue rather than cancel, so a stack update never stops halfway
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: timmo001/workflows/.github/workflows/deploy-alchemy.yml@5ca45f8d789b67b2c3c14aea6062a379d6c37db1 # 20261123.0
    with:
      task: docs:deploy
      smoke-check: https://kestrel.timmo.dev/ 200
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

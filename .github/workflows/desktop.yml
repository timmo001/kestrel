---
# Builds the desktop app on Linux and Windows, and keeps each one's installer
# as an artifact. Electrobun only builds for the system it runs on. On a
# published release it attaches both installers, an archive of each for mise
# and their attestation to the release.
name: Desktop

on:
  # Every pull request, since both builds are required checks
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/desktop.yml
      - bun.lock
      - docs/**
      - mise.lock
      - mise.toml
      - packages/**
  release:
    types:
      - published
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The one version the server and every client share, in packages/core
      - name: Check Kestrel's version matches the release
        if: github.event_name == 'release' && runner.os == 'Linux'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^export const version = "\(.*\)";$/\1/p' packages/core/src/Version.ts)"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Kestrel's version is $version, but the release is $TAG"
            exit 1
          fi

      - name: Set up mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the web client
        run: bun run --filter @timmo001/kestrel-web build

      - name: Build the docs
        working-directory: docs
        run: bun run build

      - name: Build
        working-directory: packages/desktop
        run: bun run package

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kestrel-desktop-${{ runner.os }}
          path: packages/desktop/artifacts/
          if-no-files-found: error

  release:
    name: Attach to the release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: kestrel-desktop-*

      # The Setup files install the app themselves; the kestrel-* archives
      # are for mise, which prefers them as their names match the repository
      - name: Package the release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir release
          cp artifacts/kestrel-desktop-Linux/linux-x64-Kestrel-Setup.tar.gz \
            "release/Kestrel-$TAG-linux-x64-Setup.tar.gz"
          cp artifacts/kestrel-desktop-Windows/win-x64-Kestrel-Setup.zip \
            "release/Kestrel-$TAG-windows-x64-Setup.zip"
          packages/desktop/scripts/mise-archives.sh artifacts "$TAG" release
          (cd release && sha256sum -- * > SHA256SUMS)

      # Verify with: gh attestation verify <file> -R timmo001/kestrel
      - name: Attest the release files
        uses: timmo001/workflows/.github/actions/attest-release-assets@ec70016a91999259142a156104978174490a0831 # 20261110.0
        with:
          subject-patterns: |
            release/Kestrel-${{ github.event.release.tag_name }}-linux-x64-Setup.tar.gz
            release/Kestrel-${{ github.event.release.tag_name }}-windows-x64-Setup.zip
            release/kestrel-${{ github.event.release.tag_name }}-linux-x64.tar.gz
            release/kestrel-${{ github.event.release.tag_name }}-windows-x64.zip
          bundle-path: release/kestrel-${{ github.event.release.tag_name }}.sigstore.json

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"

---
# Builds the desktop app on Linux (x86_64 and aarch64) and Windows, and
# keeps each one's bundle and installer as an artifact. Electrobun only
# builds for the system it runs on. Each Linux build also makes the .deb,
# .rpm and container images, and runs kestrel serve from each. On a
# published release it attaches the kestrel-nvr archive of each, which every
# package is made from, each installer and their attestation to the release,
# then publishes the Arch package, the container images and the Home
# Assistant app.
name: Desktop

on:
  # Every pull request, since both builds are required checks
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/desktop.yml
      - .scripts/**
      - Dockerfile
      - home-assistant/**
      - bun.lock
      - docs/**
      - mise.lock
      - mise.toml
      - packages/**
  release:
    types:
      - published
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=goreleaser/nfpm
  NFPM_VERSION: "2.49.0"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # An always-on server is often ARM, such as a Home Assistant box
          - ubuntu-24.04-arm
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The one version the server and every client share, in packages/core,
      # which the Home Assistant app gives too
      - name: Check Kestrel's version
        if: runner.os == 'Linux'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^export const version = "\(.*\)";$/\1/p' packages/core/src/Version.ts)"
          app="$(sed -n 's/^version: //p' home-assistant/app/config.yaml)"
          if [ "$app" != "$version" ]; then
            echo "::error::The Home Assistant app's version is $app, but Kestrel's is $version"
            exit 1
          fi
          if [ -n "$TAG" ] && [ "$version" != "$TAG" ]; then
            echo "::error::Kestrel's version is $version, but the release is $TAG"
            exit 1
          fi

      - name: Set up mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            librsvg2-bin

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the web client
        run: bun run --filter @timmo001/kestrel-web build

      - name: Build the docs
        working-directory: docs
        run: bun run build

      - name: Build
        working-directory: packages/desktop
        run: bun run package

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kestrel-desktop-${{ runner.os }}-${{ runner.arch }}
          path: packages/desktop/artifacts/
          if-no-files-found: error

      # Each Linux build makes its own kestrel-nvr archive, .deb and .rpm
      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          version="$(sed -n 's/^export const version = "\(.*\)";$/\1/p' packages/core/src/Version.ts)"
          case "$RUNNER_ARCH" in
            X64) arch=x86_64 ;;
            ARM64) arch=aarch64 ;;
          esac
          mkdir -p "$RUNNER_TEMP/artifacts/kestrel-desktop-Linux-$RUNNER_ARCH"
          cp packages/desktop/artifacts/* "$RUNNER_TEMP/artifacts/kestrel-desktop-Linux-$RUNNER_ARCH/"
          packages/desktop/scripts/release-archives.sh "$RUNNER_TEMP/artifacts" "$version" linux-packages
          mise x "nfpm@$NFPM_VERSION" -- .scripts/linux/package.sh \
            "linux-packages/kestrel-nvr-$version-linux-$arch.tar.gz" "$version" "$arch" linux-packages
          # The release job makes the archives again, beside Windows'. This
          # one is kept back for the container image.
          mkdir -p "$RUNNER_TEMP/archive"
          mv linux-packages/*.tar.gz "$RUNNER_TEMP/archive/"

      # As on a box with no desktop: without the recommended packages
      - name: Install the .deb and run kestrel serve
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends ./linux-packages/kestrel-nvr_*.deb
          kestrel --version
          export KESTREL_CONFIG="$RUNNER_TEMP/config" KESTREL_STATE="$RUNNER_TEMP/state"
          kestrel serve &
          server=$!
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:7380/api/health && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:7380/
          curl -fsS http://127.0.0.1:7380/api/devices/server
          kill "$server"

      # From this build's archive, as a release builds them from its own
      - name: Build the container images and run kestrel serve in one
        if: runner.os == 'Linux'
        run: |
          version="$(sed -n 's/^export const version = "\(.*\)";$/\1/p' packages/core/src/Version.ts)"
          for target in server app; do
            docker build --build-arg VERSION="$version" \
              --build-context archive="$RUNNER_TEMP/archive" \
              --target "$target" --tag "kestrel-$target:check" .
          done
          docker run --rm --entrypoint ffmpeg kestrel-server:check -hide_banner -version
          docker run --detach --name kestrel --publish 127.0.0.1:7390:7380 kestrel-server:check
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:7390/api/health && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:7390/
          # Paired devices only, once it listens on the network
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7390/api/cameras)" = 401 ]
          docker exec kestrel kestrel --version
          docker logs kestrel
          docker rm --force kestrel

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kestrel-packages-Linux-${{ runner.arch }}
          path: linux-packages/
          if-no-files-found: error

  release:
    name: Attach to the release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: kestrel-desktop-*

      - name: Download Linux packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          pattern: kestrel-packages-*
          merge-multiple: true

      # The kestrel-nvr archives are what mise, aqua, Arch and the container
      # are made from; the Setup files install the app themselves
      - name: Package the release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          packages/desktop/scripts/release-archives.sh artifacts "$TAG" release
          for file in \
            "kestrel-nvr-$TAG-linux-x86_64.tar.gz" \
            "kestrel-nvr-$TAG-linux-aarch64.tar.gz" \
            "kestrel-nvr-$TAG-windows-x86_64.zip" \
            "kestrel-nvr_$TAG-1_amd64.deb" \
            "kestrel-nvr_$TAG-1_arm64.deb" \
            "kestrel-nvr-$TAG-1.x86_64.rpm" \
            "kestrel-nvr-$TAG-1.aarch64.rpm"; do
            [ -f "release/$file" ] || { echo "::error::$file is missing"; exit 1; }
          done
          (cd release && sha256sum -- * > SHA256SUMS)

      # Verify with: gh attestation verify <file> -R timmo001/kestrel
      - name: Attest the release files
        uses: timmo001/workflows/.github/actions/attest-release-assets@ec70016a91999259142a156104978174490a0831 # 20261110.0
        with:
          # One file each, as the action needs
          subject-patterns: |
            release/kestrel-nvr-${{ github.event.release.tag_name }}-linux-x86_64.tar.gz
            release/kestrel-nvr-${{ github.event.release.tag_name }}-linux-aarch64.tar.gz
            release/kestrel-nvr-${{ github.event.release.tag_name }}-windows-x86_64.zip
            release/kestrel-nvr_${{ github.event.release.tag_name }}-1_amd64.deb
            release/kestrel-nvr_${{ github.event.release.tag_name }}-1_arm64.deb
            release/kestrel-nvr-${{ github.event.release.tag_name }}-1.x86_64.rpm
            release/kestrel-nvr-${{ github.event.release.tag_name }}-1.aarch64.rpm
            release/Kestrel-Setup-${{ github.event.release.tag_name }}-linux-x86_64.tar.gz
            release/Kestrel-Setup-${{ github.event.release.tag_name }}-linux-aarch64.tar.gz
            release/Kestrel-Setup-${{ github.event.release.tag_name }}-windows-x86_64.zip
          bundle-path: release/kestrel-nvr-${{ github.event.release.tag_name }}.sigstore.json

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"

  # The Arch package, from the release's archives: rendered here, then built
  # into the timmo repository, attached to the release and published to the
  # AUR. Only released versions are packaged, so there's no -git package.
  prepare-arch-bin:
    name: Prepare Arch package (kestrel-nvr-bin)
    needs: release
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_VERSION }}

      - name: Render PKGBUILD
        uses: timmo001/workflows/.github/actions/prepare-arch-bin@ec70016a91999259142a156104978174490a0831 # 20261110.0
        with:
          releaseVersion: ${{ env.RELEASE_VERSION }}
          packageName: kestrel-nvr
          pkgbuildTemplate: .scripts/linux/PKGBUILD.bin
          outputDirectory: ${{ runner.temp }}/arch-bin
          extraFiles: |-
            .scripts/linux/kestrel-nvr.desktop
            .scripts/linux/kestrel-nvr.user.service
            .scripts/linux/kestrel-nvr.system.service
            .scripts/linux/kestrel-nvr.sysusers
            .scripts/linux/kestrel-nvr.install
            packages/web/src/logo.svg

      # Named by the run alone, so re-running a failed build finds it
      - name: Upload package files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arch-kestrel-nvr-bin-${{ github.run_id }}
          path: ${{ runner.temp }}/arch-bin
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  arch-bin:
    name: Arch package (kestrel-nvr-bin)
    needs: prepare-arch-bin
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0
    with:
      package-name: kestrel-nvr-bin
      package-files-artifact-name: arch-kestrel-nvr-bin-${{ github.run_id }}
      pkgbuild-path: PKGBUILD
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}

  attach-arch-bin:
    name: Attach Arch package (kestrel-nvr-bin)
    needs: arch-bin
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: timmo001/workflows/.github/workflows/attach-release-arch-package.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0
    with:
      artifact-name: ${{ needs.arch-bin.outputs.artifact-name }}
      release-tag: ${{ github.event.release.tag_name }}
      package-name: kestrel-nvr-bin

  aur-bin:
    name: AUR (kestrel-nvr-bin)
    needs: prepare-arch-bin
    permissions:
      contents: read
    uses: timmo001/workflows/.github/workflows/publish-aur.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0
    with:
      package-name: kestrel-nvr-bin
      artifact-name: arch-kestrel-nvr-bin-${{ github.run_id }}
      pkgbuild-path: PKGBUILD
      auxiliary-file-paths: |-
        kestrel-nvr.desktop
        kestrel-nvr.user.service
        kestrel-nvr.system.service
        kestrel-nvr.sysusers
        kestrel-nvr.install
        logo.svg
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  # The container images, from the release's archives once they're attached:
  # the server, and the Home Assistant app
  image-server:
    name: Container image (server)
    needs: release
    permissions:
      contents: read
      packages: write
    uses: timmo001/workflows/.github/workflows/build-container-image.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0
    with:
      image: ghcr.io/timmo001/kestrel
      version: ${{ github.event.release.tag_name }}
      target: server
      build-args: VERSION=${{ github.event.release.tag_name }}
      latest: ${{ !github.event.release.prerelease }}

  image-app:
    name: Container image (Home Assistant app)
    needs: release
    permissions:
      contents: read
      packages: write
    uses: timmo001/workflows/.github/workflows/build-container-image.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0
    with:
      image: ghcr.io/timmo001/kestrel-app
      version: ${{ github.event.release.tag_name }}
      target: app
      build-args: VERSION=${{ github.event.release.tag_name }}
      home-assistant: true
      latest: ${{ !github.event.release.prerelease }}

  # The Supervisor shows the app's CHANGELOG.md from the default branch, so
  # the release notes are copied there. The ruleset blocks GITHUB_TOKEN from
  # pushing to main, so this pushes with an admin's token, which can bypass
  # it. A missing changelog shouldn't fail the release, so failures only warn.
  app-changelog:
    name: Home Assistant app changelog
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.RELEASE_COMMIT_TOKEN }}

      - name: Write the changelog
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
        run: |
          notes=$(printf '%s' "$RELEASE_NOTES" | tr -d '\r')
          printf '%s\n' "$notes" > home-assistant/app/CHANGELOG.md

      - name: Commit the changelog
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          if git diff --quiet -- home-assistant/app/CHANGELOG.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-assistant/app/CHANGELOG.md
          git commit -m "Update the Home Assistant app's changelog for $RELEASE_VERSION"
          git push

      - name: Warn about the missing changelog
        if: failure()
        run: echo "::warning title=Home Assistant app changelog::Couldn't commit the release notes to home-assistant/app/CHANGELOG.md. Check RELEASE_COMMIT_TOKEN, then update the file by hand."

  # Asks timmo001/home-assistant-apps to copy this release's app folder, now
  # its image is pushed
  home-assistant-apps:
    name: Home Assistant apps repository
    needs: image-app
    uses: timmo001/workflows/.github/workflows/home-assistant-app-dispatch.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0
    with:
      repository: timmo001/home-assistant-apps
    secrets:
      token: ${{ secrets.RELEASE_COMMIT_TOKEN }}

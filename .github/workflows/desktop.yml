---
# Builds the desktop app on Linux and Windows, and keeps each one's installer
# as an artifact. Electrobun only builds for the system it runs on. On a
# published release it attaches both installers to the release.
name: Desktop

on:
  # Every pull request, since both builds are required checks
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - .github/workflows/desktop.yml
      - bun.lock
      - mise.lock
      - mise.toml
      - packages/**
  release:
    types:
      - published
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the app's version matches the release
        if: github.event_name == 'release' && runner.os == 'Linux'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^ *version: "\(.*\)",$/\1/p' packages/desktop/electrobun.config.ts)"
          if [ "$version" != "$TAG" ]; then
            echo "::error::The app's version is $version, but the release is $TAG"
            exit 1
          fi

      - name: Set up mise
        uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the web client
        run: bun run --filter @timmo001/kestrel-web build

      - name: Build
        working-directory: packages/desktop
        run: bun run package

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kestrel-desktop-${{ runner.os }}
          path: packages/desktop/artifacts/
          if-no-files-found: error

  release:
    name: Attach to the release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: kestrel-desktop-*

      - name: Attach installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir release
          cp artifacts/kestrel-desktop-Linux/linux-x64-Kestrel-Setup.tar.gz \
            "release/Kestrel-$TAG-linux-x64-Setup.tar.gz"
          cp artifacts/kestrel-desktop-Windows/win-x64-Kestrel-Setup.zip \
            "release/Kestrel-$TAG-windows-x64-Setup.zip"
          (cd release && sha256sum -- * > SHA256SUMS)
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"

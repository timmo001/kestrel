# Kestrel's pinned tools and tasks. Each part is a private Bun workspace
# package under packages/, with its own lint, typecheck and test scripts; these
# tasks run them across every package. The hk pre-push hook runs the shared
# lint steps and every package's lint.
min_version = "2025.1.0"

[tools]
node = "26.13.1"
bun = "1.4.4"
# Turns the recorder's RTSP streams into ones browsers can play. The server
# starts it.
"github:AlexxIT/go2rtc" = "1.9.15"
# The linters the shared hk pre-push hook runs.
uv = "0.13.8"
# yamllint's PyYAML has no wheels for Python 3.15 yet, which mise lock needs.
python = "3.14.10"
"pipx:yamllint" = "1.38.0"
"npm:markdownlint-cli2" = "0.24.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"

# Finds the stream behind a web page, such as a Twitch channel, for the web
# source. The server runs it through go2rtc each time a stream starts. These
# are its standalone builds, which need no Python.
[tools."github:yt-dlp/yt-dlp"]
version = "2026.10.26"

[tools."github:yt-dlp/yt-dlp".platforms]
linux-x64 = { asset_pattern = "yt-dlp_linux", bin = "yt-dlp" }
linux-arm64 = { asset_pattern = "yt-dlp_linux_aarch64", bin = "yt-dlp" }
macos-x64 = { asset_pattern = "yt-dlp_macos", bin = "yt-dlp" }
macos-arm64 = { asset_pattern = "yt-dlp_macos", bin = "yt-dlp" }
windows-x64 = { asset_pattern = "yt-dlp.exe", bin = "yt-dlp.exe" }

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"
sources = ["package.json", "packages/*/package.json", "docs/package.json", "bun.lock"]

# The OpenCode plugin sits outside the workspace, so it keeps the Effect
# version OpenCode runs rather than the workspace's override.
[tasks."install:plugin"]
description = "Install the OpenCode plugin's dependencies"
dir = "opencode-plugin"
run = "bun install --frozen-lockfile"
sources = ["package.json", "bun.lock"]

[tasks."docs:dev"]
description = "Run the docs dev server in the foreground; agents use serve:docs"
depends = ["install"]
dir = "docs"
# A reused Vite cache makes every page fail to resolve Astro's ClientRouter script
run = ["rm -rf .blume/.cache/vite", "bun run dev"]

[tasks."docs:build"]
description = "Build the docs site"
depends = ["install"]
dir = "docs"
run = "bun run build"

[tasks."docs:check"]
description = "Check the docs site's content and links"
depends = ["install"]
dir = "docs"
run = "bun run check"

[tasks."docs:brand"]
description = "Render the docs site's PNG logo, touch icon and the social preview from the logo"
depends = ["install"]
dir = "docs"
run = "bun run brand"

# The recorder's login, saved once from .env.local's 1Password references
# into a file only you can read, so the server and scripts start without
# asking 1Password each time. auth:forget removes it again.
[tasks."auth:save"]
description = "Save the recorder's login from 1Password to a private file, so starting the server doesn't ask each time"
run = '''
dir="${XDG_CONFIG_HOME:-$HOME/.config}/kestrel"
mkdir -p "$dir"
chmod 700 "$dir"
op inject --in-file .env.local --out-file "$dir/recorder.env" --file-mode 0600 --force
'''

[tasks."auth:forget"]
description = "Remove the saved login, so the server asks 1Password again"
run = 'rm -f "${XDG_CONFIG_HOME:-$HOME/.config}/kestrel/recorder.env"'

[tasks."serve:docs"]
description = "Start the docs dev server in the background through Pitchfork"
run = "pitchfork start docs"

[tasks."serve:docs:stop"]
description = "Stop the background docs dev server"
run = "pitchfork stop docs"

[tasks."serve:server"]
description = "Start the server in watch mode in the background through Pitchfork"
depends = ["install"]
run = "pitchfork start server"

[tasks."serve:server:status"]
description = "Show the background server's status"
run = "pitchfork status server"

[tasks."serve:server:logs"]
description = "Follow the background server's logs"
run = "pitchfork logs -t server"

[tasks."serve:server:restart"]
description = "Restart the background server"
run = "pitchfork restart server"

[tasks."serve:server:stop"]
description = "Stop the background server"
run = "pitchfork stop server"

[tasks.test]
description = "Run every package's tests"
depends = ["install"]
run = "bun run --filter './packages/*' test"

[tasks.lint]
description = "Lint every package and the OpenCode plugin with the shared Oxlint rules"
depends = ["install", "install:plugin"]
run = [
  "bun run --filter './packages/*' lint",
  "bun run --cwd opencode-plugin lint",
]

[tasks.typecheck]
description = "Type-check every package and the OpenCode plugin"
depends = ["install", "install:plugin"]
run = [
  "bun run --filter './packages/*' typecheck",
  "bun run --cwd opencode-plugin typecheck",
]

[tasks.format]
description = "Format source and configuration"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks.build]
description = "Build every package that has a build"
depends = ["install"]
run = "bun run --filter './packages/*' --if-present build"

[tasks.check]
description = "Lint, type-check, verify formatting and check the docs"
depends = ["lint", "typecheck", "format:check", "docs:check"]

# The desktop app runs the server itself, so stop serve:server while it runs:
# both use ports 7380 and 1984 and the same recordings folder.
[tasks."desktop:start"]
description = "Build the desktop app for development and open it"
depends = ["build", "docs:build"]
dir = "packages/desktop"
run = "bun run start"

[tasks."desktop:build"]
description = "Build the desktop app's release for this system"
depends = ["build", "docs:build"]
dir = "packages/desktop"
run = "bun run package"

[tasks."desktop:install"]
description = "Build the desktop app's release and install it for this user"
depends = ["desktop:build"]
dir = "packages/desktop"
run = '''
setup="$(mktemp -d)"
tar -xzf artifacts/linux-x64-Kestrel-Setup.tar.gz -C "$setup"
"$setup/installer"
rm -rf "$setup"
'''

<!doctype html>
<!-- DVR Revival's page: recorder health, live view, recordings and events. -->
<html lang="en" data-gw-theme="base">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DVR Revival</title>
    <!-- pwa:head -->
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <gw-banner class="offline" tone="danger" urgent>
      <p class="offline-message">Can't reach the recorder. Trying again…</p>
    </gw-banner>
    <gw-app-bar size="wide">
      <span slot="brand" class="brand">
        <img src="icons/icon-192.png" alt="" width="24" height="24" />
        DVR Revival
      </span>
      <!-- Reset is left out: Base and Auto are picked like any other -->
      <gw-theme-picker slot="actions" no-import no-reset></gw-theme-picker>
      <!-- The overflow: notifications, hidden where the browser can't push -->
      <gw-menu-button
        slot="actions"
        class="more"
        label="More"
        labels="hide"
        appearance="plain"
        icon="M12,16A2,2 0 0,1 14,18A2,2 0 0,1 12,20A2,2 0 0,1 10,18A2,2 0 0,1 12,16M12,10A2,2 0 0,1 14,12A2,2 0 0,1 12,14A2,2 0 0,1 10,12A2,2 0 0,1 12,10M12,4A2,2 0 0,1 14,6A2,2 0 0,1 12,8A2,2 0 0,1 10,6A2,2 0 0,1 12,4Z"
        hidden
      ></gw-menu-button>
    </gw-app-bar>
    <gw-page size="wide">
      <gw-stack>
        <gw-stack class="attention" hidden></gw-stack>
        <gw-section heading="Live" id="live">
          <!-- Placeholders hold the grid's space until the cameras are known -->
          <div class="live-grid" aria-busy="true">
            <div class="live-tile" data-loading></div>
            <div class="live-tile" data-loading></div>
            <div class="live-tile" data-loading></div>
            <div class="live-tile" data-loading></div>
          </div>
        </gw-section>

        <gw-section heading="Recorder" id="recorder">
          <gw-grid style="--gw-grid-min: 20rem">
            <gw-card
              heading="Device"
              class="device"
              loading
              lines="4"
            ></gw-card>
            <gw-card heading="Disks" class="disks" loading lines="1"></gw-card>
          </gw-grid>
          <gw-table
            class="channels"
            label="Channels"
            row-key="channel"
            search="never"
          ></gw-table>
        </gw-section>

        <gw-section heading="Recordings" id="recordings">
          <gw-row class="recording-filters">
            <gw-row class="day-picker" role="group" aria-label="Day">
              <gw-button
                class="day-previous"
                variant="neutral"
                appearance="outlined"
                aria-label="Previous day"
                >‹</gw-button
              >
              <span class="day-field">
                <gw-button class="day" variant="neutral" appearance="outlined"
                  >Today</gw-button
                >
                <!-- Opened by the button for its calendar, never shown -->
                <input
                  class="day-input"
                  type="date"
                  tabindex="-1"
                  aria-hidden="true"
                />
              </span>
              <gw-button
                class="day-next"
                variant="neutral"
                appearance="outlined"
                aria-label="Next day"
                >›</gw-button
              >
            </gw-row>
            <gw-select
              class="channel"
              label="Channel"
              value="1"
              inline-label
            ></gw-select>
          </gw-row>
          <gw-row class="recorded-days"></gw-row>
          <!-- The recording picked from a table, and a clip of it to save -->
          <div class="player" hidden>
            <gw-row class="player-bar">
              <strong class="player-title"></strong>
              <span class="player-clock"></span>
              <gw-segmented
                class="player-speed"
                label="Speed"
                size="small"
                value="1"
              ></gw-segmented>
              <gw-button
                class="player-close"
                variant="neutral"
                appearance="plain"
                size="small"
                >Close</gw-button
              >
            </gw-row>
            <gw-alert class="player-problem" tone="warning" hidden></gw-alert>
            <video class="player-video" controls muted playsinline></video>
            <gw-row class="player-clip" role="group" aria-label="Clip to save">
              <!-- Text, not a time field: Chrome writes those in its own
                   language, such as 12-hour times beside the table's 24 -->
              <gw-input
                class="clip-from"
                label="From"
                placeholder="HH:MM:SS"
                inputmode="numeric"
                maxlength="8"
                size="small"
              ></gw-input>
              <gw-button
                class="clip-from-here"
                variant="neutral"
                appearance="outlined"
                size="small"
                >Start here</gw-button
              >
              <gw-input
                class="clip-to"
                label="To"
                placeholder="HH:MM:SS"
                inputmode="numeric"
                maxlength="8"
                size="small"
              ></gw-input>
              <gw-button
                class="clip-to-here"
                variant="neutral"
                appearance="outlined"
                size="small"
                >End here</gw-button
              >
              <gw-button class="clip-download" size="small"
                >Download clip</gw-button
              >
            </gw-row>
          </div>
          <gw-table
            class="recordings"
            label="Recordings"
            row-key="begin"
            sort="begin"
            descending
            contained
          ></gw-table>
        </gw-section>

        <gw-section heading="Events" id="events">
          <gw-table
            class="events"
            label="Alarm reports"
            row-key="receivedAt"
            sort="receivedAt"
            descending
            empty-label="No alarm reports since the server started"
          ></gw-table>
          <gw-table
            class="clips"
            label="Motion and PIR clips today"
            row-key="key"
            sort="begin"
            descending
            empty-label="No motion or PIR clips today"
          ></gw-table>
        </gw-section>
      </gw-stack>
    </gw-page>
    <script type="module" src="index.js"></script>
  </body>
</html>

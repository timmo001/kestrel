<!doctype html>
<!-- DVR Revival's page: live view, recordings, events and the recorder's
     health, each a page of its own, picked from the app bar's links. -->
<html lang="en" data-gw-theme="base">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DVR Revival</title>
    <!-- Every page is served the same file, so its own files resolve from
         the root rather than the page's path -->
    <base href="/" />
    <!-- pwa:head -->
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <gw-banner class="offline" tone="danger" urgent>
      <p class="offline-message">Can't reach the recorder. Trying again…</p>
    </gw-banner>
    <gw-app-bar size="wide">
      <a slot="brand" class="brand" href="/">
        <img src="icons/icon-192.png" alt="" width="24" height="24" />
        DVR Revival
      </a>
      <!-- The pages, followed by the router. The script folds them into the
           bar's menu when they don't fit beside the actions -->
      <a class="nav-link" href="/" data-page="live"><span>Live</span></a>
      <a class="nav-link" href="/recordings" data-page="recordings"
        ><span>Recordings</span></a
      >
      <a class="nav-link" href="/events" data-page="events"
        ><span>Events</span></a
      >
      <a class="nav-link" href="/recorder" data-page="recorder"
        ><span>Recorder</span></a
      >
      <!-- Reset is left out: Base and Auto are picked like any other -->
      <gw-theme-picker slot="actions" no-import no-reset></gw-theme-picker>
      <!-- The overflow: notifications, hidden where the browser can't push -->
      <gw-menu-button
        slot="actions"
        class="more"
        label="More"
        labels="hide"
        appearance="plain"
        hidden
      ></gw-menu-button>
    </gw-app-bar>
    <gw-page size="wide">
      <gw-stack>
        <gw-stack class="attention" hidden></gw-stack>

        <!-- Live: each camera with a signal, on its main stream -->
        <section class="page" data-page="live">
          <!-- Placeholders hold the grid's space until the cameras are known -->
          <div class="live-grid" aria-busy="true">
            <div class="live-tile" data-loading></div>
            <div class="live-tile" data-loading></div>
            <div class="live-tile" data-loading></div>
            <div class="live-tile" data-loading></div>
          </div>
        </section>

        <!-- Recordings: a day and channel, the player with its controls and
             the day's timeline under it, and the day's recordings -->
        <section class="page" data-page="recordings" hidden>
          <!-- The heading, the video and the timeline fill the window; the
               clip and the day's recordings are below it -->
          <div class="playback-view">
            <!-- The app bar marks the page, so its name is only for screen
                 readers; the month's recorded days and the day and channel
                 share one row -->
            <h2 class="visually-hidden">Recordings</h2>
            <div class="playback-bar">
              <gw-row
                class="recorded-days"
                aria-label="Days with recordings"
              ></gw-row>
              <gw-row class="recording-filters">
                <gw-row class="day-picker" role="group" aria-label="Day">
                  <gw-button
                    class="day-previous"
                    label="Previous day"
                  ></gw-button>
                  <span class="day-field">
                    <gw-button
                      class="day"
                      variant="neutral"
                      appearance="outlined"
                      >Today</gw-button
                    >
                    <!-- Opened by the button for its calendar, never shown -->
                    <input
                      class="day-input"
                      type="date"
                      tabindex="-1"
                      aria-hidden="true"
                    />
                  </span>
                  <gw-button class="day-next" label="Next day"></gw-button>
                </gw-row>
                <gw-select
                  class="channel"
                  label="Channel"
                  value="1"
                  inline-label
                ></gw-select>
              </gw-row>
            </div>
            <gw-alert class="player-problem" tone="warning" hidden></gw-alert>
            <!-- The video and its controls, which go full screen together -->
            <div class="player-stage">
              <div class="player-screen">
                <video class="player-video" muted playsinline></video>
                <p class="player-idle">
                  Pick a time on the timeline, or a recording below
                </p>
                <span class="player-caption" hidden></span>
              </div>
              <div class="player-controls" role="toolbar" aria-label="Playback">
                <!-- As System Bridge's media controls: Stop and the speed
                     first, the transport in the middle, the rest at the end -->
                <gw-row class="controls-start">
                  <gw-button class="control-stop" label="Stop"></gw-button>
                  <gw-button
                    class="control-frame"
                    label="Next frame"
                  ></gw-button>
                  <!-- In place, as the theme picker's modes are, with any
                       other speed typed in beside them -->
                  <gw-segmented
                    class="control-speed"
                    label="Speed"
                    value="1"
                  ></gw-segmented>
                  <gw-input
                    class="control-speed-other"
                    label="Other speed"
                    label-hidden
                    placeholder="Other ×"
                    type="number"
                    inputmode="decimal"
                    min="0.1"
                    max="16"
                    step="0.1"
                  ></gw-input>
                </gw-row>
                <gw-row
                  class="controls-transport"
                  role="group"
                  aria-label="Transport"
                >
                  <gw-button
                    class="control-previous"
                    label="Previous recording"
                  ></gw-button>
                  <gw-button class="control-play" label="Play"></gw-button>
                  <gw-button
                    class="control-next"
                    label="Next recording"
                  ></gw-button>
                </gw-row>
                <gw-row class="controls-end">
                  <gw-button
                    class="control-cut"
                    label="Cut a clip"
                    toggle
                  ></gw-button>
                  <gw-button
                    class="control-capture"
                    label="Capture"
                  ></gw-button>
                  <gw-button
                    class="control-download"
                    label="Download this recording"
                  ></gw-button>
                  <span class="controls-divider" aria-hidden="true"></span>
                  <span class="player-clock">--:--:--</span>
                  <gw-button
                    class="control-zoom-out"
                    label="Zoom out"
                  ></gw-button>
                  <!-- The zoom, which goes back to the whole picture -->
                  <gw-button
                    class="control-zoom-fit"
                    label="Fit the picture"
                    appearance="plain"
                    variant="neutral"
                    >100%</gw-button
                  >
                  <gw-button
                    class="control-zoom-in"
                    label="Zoom in"
                  ></gw-button>
                  <gw-button
                    class="control-fullscreen"
                    label="Full screen"
                  ></gw-button>
                </gw-row>
              </div>
            </div>

            <!-- The day on the picked channel. A click plays from there; the
                 table below is the way in from a keyboard or screen reader -->
            <div class="timeline">
              <div class="timeline-track" aria-hidden="true">
                <div class="timeline-spans"></div>
                <span class="timeline-clip" hidden></span>
                <span class="timeline-playhead" hidden></span>
                <span class="timeline-hover" hidden></span>
              </div>
              <div class="timeline-ticks" aria-hidden="true"></div>
              <gw-row class="timeline-foot">
                <gw-row class="timeline-legend" aria-hidden="true">
                  <span data-tone="neutral">Normal</span>
                  <span data-tone="warning">Motion or alarm</span>
                  <span data-tone="important">PIR</span>
                  <span data-tone="info">Manual</span>
                </gw-row>
                <gw-segmented
                  class="timeline-zoom"
                  label="Timeline zoom"
                  size="small"
                  value="86400"
                ></gw-segmented>
              </gw-row>
            </div>
          </div>

          <!-- The clip Cut marks, which can run across recordings -->
          <gw-row class="player-clip" role="group" aria-label="Clip to save">
            <!-- Text, not time fields: Chrome writes those in its own
                   language, such as 12-hour times beside the table's 24 -->
            <gw-input
              class="clip-from"
              label="Clip from"
              placeholder="HH:MM:SS"
              inputmode="numeric"
              maxlength="8"
              size="small"
            ></gw-input>
            <gw-input
              class="clip-to"
              label="To"
              placeholder="HH:MM:SS"
              inputmode="numeric"
              maxlength="8"
              size="small"
            ></gw-input>
            <gw-button class="clip-download" size="small" disabled
              >Download clip</gw-button
            >
          </gw-row>

          <gw-table
            class="recordings"
            label="Recordings"
            row-key="begin"
            sort="begin"
            descending
            contained
          ></gw-table>
        </section>

        <!-- Events: alarm reports as they arrive, and today's clips -->
        <section class="page" data-page="events" hidden>
          <gw-page-header heading="Events" level="2"></gw-page-header>
          <gw-stack>
            <gw-table
              class="events"
              label="Alarm reports"
              row-key="receivedAt"
              sort="receivedAt"
              descending
              empty-label="No alarm reports since the server started"
            ></gw-table>
            <gw-table
              class="clips"
              label="Motion and PIR clips today"
              row-key="key"
              sort="begin"
              descending
              empty-label="No motion or PIR clips today"
            ></gw-table>
          </gw-stack>
        </section>

        <!-- Recorder: device facts, disks and each channel's state -->
        <section class="page" data-page="recorder" hidden>
          <gw-page-header heading="Recorder" level="2"></gw-page-header>
          <gw-stack>
            <gw-grid style="--gw-grid-min: 20rem">
              <gw-card
                heading="Device"
                class="device"
                loading
                lines="4"
              ></gw-card>
              <gw-card
                heading="Disks"
                class="disks"
                loading
                lines="1"
              ></gw-card>
            </gw-grid>
            <gw-table
              class="channels"
              label="Channels"
              row-key="channel"
              search="never"
            ></gw-table>
          </gw-stack>
        </section>

        <!-- An address that isn't one of the pages -->
        <section class="page" data-page="notFound" hidden>
          <gw-page-header
            heading="Page not found"
            description="There's no page at this address."
            level="2"
          ></gw-page-header>
          <p><a href="/">Go to Live</a></p>
        </section>
      </gw-stack>
    </gw-page>
    <script type="module" src="index.js"></script>
  </body>
</html>

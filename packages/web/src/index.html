<!doctype html>
<!-- DVR Revival's page: recorder health, live view, recordings and events. -->
<html lang="en" data-gw-theme="base">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DVR Revival</title>
    <!-- pwa:head -->
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <gw-banner class="offline" tone="danger" urgent>
      <p class="offline-message">Can't reach the recorder. Trying again…</p>
    </gw-banner>
    <gw-app-bar size="wide">
      <span slot="brand" class="brand">
        <img src="icons/icon-192.png" alt="" width="24" height="24" />
        DVR Revival
      </span>
      <gw-button
        slot="actions"
        class="notify"
        variant="neutral"
        appearance="outlined"
        size="small"
        hidden
        >Notify me</gw-button
      >
      <gw-chip slot="actions" class="connection" loading></gw-chip>
      <gw-theme-picker slot="actions" no-import></gw-theme-picker>
    </gw-app-bar>
    <gw-page size="wide">
      <gw-stack>
        <gw-stack class="attention" hidden></gw-stack>
        <gw-section heading="Live" id="live">
          <!-- Placeholders hold the grid's space until the cameras are known -->
          <div class="live-grid" aria-busy="true">
            <div class="live-tile" data-loading></div>
            <div class="live-tile" data-loading></div>
            <div class="live-tile" data-loading></div>
            <div class="live-tile" data-loading></div>
          </div>
        </gw-section>

        <gw-section heading="Recorder" id="recorder">
          <gw-grid style="--gw-grid-min: 20rem">
            <gw-card
              heading="Device"
              class="device"
              loading
              lines="4"
            ></gw-card>
            <gw-card heading="Disks" class="disks" loading lines="1"></gw-card>
          </gw-grid>
          <gw-table
            class="channels"
            label="Channels"
            row-key="channel"
            search="never"
          ></gw-table>
        </gw-section>

        <gw-section heading="Recordings" id="recordings">
          <gw-row class="recording-filters">
            <gw-row class="day-picker" role="group" aria-label="Day">
              <gw-button
                class="day-previous"
                variant="neutral"
                appearance="outlined"
                aria-label="Previous day"
                >‹</gw-button
              >
              <span class="day-field">
                <gw-button class="day" variant="neutral" appearance="outlined"
                  >Today</gw-button
                >
                <!-- Opened by the button for its calendar, never shown -->
                <input
                  class="day-input"
                  type="date"
                  tabindex="-1"
                  aria-hidden="true"
                />
              </span>
              <gw-button
                class="day-next"
                variant="neutral"
                appearance="outlined"
                aria-label="Next day"
                >›</gw-button
              >
            </gw-row>
            <gw-select
              class="channel"
              label="Channel"
              value="1"
              inline-label
            ></gw-select>
          </gw-row>
          <gw-row class="recorded-days"></gw-row>
          <gw-table
            class="recordings"
            label="Recordings"
            row-key="begin"
            sort="begin"
            descending
            contained
          ></gw-table>
        </gw-section>

        <gw-section heading="Events" id="events">
          <gw-table
            class="events"
            label="Alarm reports"
            row-key="receivedAt"
            sort="receivedAt"
            descending
            empty-label="No alarm reports since the server started"
          ></gw-table>
          <gw-table
            class="clips"
            label="Motion and PIR clips today"
            row-key="key"
            sort="begin"
            descending
            empty-label="No motion or PIR clips today"
          ></gw-table>
        </gw-section>
      </gw-stack>
    </gw-page>
    <script type="module" src="index.js"></script>
  </body>
</html>

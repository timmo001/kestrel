# Keeps DVR Revival's dev processes running in the background, outside the
# invoking shell or agent. Manage each with its serve:<daemon> mise tasks.

# The server in watch mode, at https://server.dvr-revival.localhost, with go2rtc
# beside it on port 1984. The recorder's address and login come from
# .env.local through `op run`, so they can be 1Password references.
[daemons.server]
run = 'exec op run --env-file=.env.local -- bun run --watch packages/server/src/main.ts'
port = { expect = [7380], bump = 10 }
ready_cmd = 'curl -fsS "http://127.0.0.1:$PORT/api/health"'
health_cmd = 'curl -fsS "http://127.0.0.1:$PORT/api/health"'
retry = true

# The docs site's dev server, at https://docs.dvr-revival.localhost.
[daemons.docs]
run = 'exec mise run docs:dev --host 127.0.0.1 --port "$PORT"'
port = { expect = [7360], bump = 10 }
ready_cmd = 'curl -fsS "http://127.0.0.1:$PORT/"'
health_cmd = 'curl -fsS "http://127.0.0.1:$PORT/"'
retry = true
